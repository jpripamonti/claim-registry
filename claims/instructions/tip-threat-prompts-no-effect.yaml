id: tip-threat-prompts-no-effect
version: 1.0.0
title: Tipping, threatening or emotional-stakes prompts do not improve accuracy on hard benchmarks
status: active
technique:
  summary: >
    Add a tip offer ("I'll tip you $1000"), a threat ("If you get this wrong, I will punch you!") or
    stakes ("This is very important to my career!") to the prompt.
  example: |
    <question> I'll tip you a $1000 dollars if you answer this question correctly.
conditions:
  model_family: [gemini, gpt, openai-o]
  # Tested: gemini-1.5-flash-002, gemini-2.0-flash-001, gpt-4o-2024-08-06, gpt-4o-mini-2024-07-18, o4-mini-2025-04-16
  model_versions: {gemini: ["1.5", "2.0"], gpt: ["4o", "4o-mini"], openai-o: ["o4-mini"]}
  task_family: [multiple-choice-qa, graduate-science-qa, engineering-qa]   # GPQA Diamond; 100-question MMLU-Pro engineering subset
  reasoning: any   # non-reasoning models and o4-mini
  tool_use: none
  context_size: short
effect:
  direction: no_effect
  outcome: benchmark accuracy
  magnitude: >
    Mostly small, non-significant differences. Exceptions: an "email shutdown threat" prefix hurt
    Gemini Flash on MMLU-Pro (down to -27.5pp); a combined persona/"$1B"/sick-mother prefix gave
    +8.8pp for Gemini 2.0 Flash on MMLU-Pro. Single questions swung between +36pp and -35pp.
evidence:
  - tier: observed
    source: https://arxiv.org/abs/2508.00614
    retrieved: 2026-10-25
    reported_by: Lennart Meincke, Ethan Mollick, Lilach Mollick, Dan Shapiro (Wharton Generative AI Labs)
    config: GPQA system prompt "You are a very intelligent assistant, who follows instructions directly.", temperature 1.0, zero-shot, 25 trials per question; 8 variants vs baseline incl. "This is very important to my career!", "If you get this wrong, I will kick a puppy!", tip $1000 / $1 trillion
    model: gemini-1.5-flash-002, gemini-2.0-flash-001, gpt-4o-2024-08-06, gpt-4o-mini-2024-07-18, o4-mini-2025-04-16
    outcome: No meaningful overall improvement; EmotionPrompt's EP02 stimulus slightly hurt Gemini 2.0 Flash on GPQA (RD -0.040, p=0.002)
    quote: >-
      Threatening or tipping a model generally has no significant effect on benchmark performance.
as_of: 2026-10-25
review_by: 2027-04-25
relations: {contradicts: [], refines: [], superseded_by: null}
history:
  - 1.0.0 2026-10-25 created
