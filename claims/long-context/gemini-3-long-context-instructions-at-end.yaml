id: gemini-3-long-context-instructions-at-end
version: 1.0.0
title: With large context on Gemini 3, put all the context first and the instructions or question at the very end
status: active
technique:
  summary: >
    Supply the documents or code first, bridge with a phrase like "Based on the information
    above...", and place the specific instruction or question last.
