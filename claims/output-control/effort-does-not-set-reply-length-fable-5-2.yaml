id: effort-does-not-set-reply-length-fable-5-2
version: 1.0.0
title: On Claude Fable 5.2, changing effort barely changes reply length; prompt for length and tone instead
status: active
technique:
  summary: >
    Raising or lowering the effort level to make replies shorter or longer. Effort changes how much
    the model thinks and how many tool calls it makes, not the length of its replies; use prompt
    instructions to set reply length and tone.
