id: per-message-effort-change-keeps-cache
version: 1.0.0
title: Change effort mid-conversation with a per-message effort change, not the top-level value, to keep the prompt cache
status: active
technique:
  summary: >
    To change the effort level partway through a conversation, use a per-message effort change
    (beta) instead of changing the top-level effort value between requests. The change holds for
    later turns until replaced. It needs adaptive thinking (a 400 error with Sonnet's between_tools
    or Haiku's thinking off).
conditions:
  model_family: [claude-opus, claude-sonnet, claude-haiku]
  model_versions: {claude-opus: ["5.5"], claude-sonnet: ["5.5"], claude-haiku: ["5.5"]}
  task_family: [unspecified]
  reasoning: enabled   # per-message effort changes need adaptive thinking
  tool_use: unspecified
  context_size: unspecified
effect:
  direction: helps
  outcome: prompt cache kept when the effort level changes mid-conversation
  magnitude: null
evidence:
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5
    retrieved: 2026-11-02
    quote: >-
      Changing the top-level `effort` value between requests invalidates the prompt cache. To change the level partway through a conversation, use a per-message effort change (beta) instead, which keeps the cache.
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-sonnet-5-5
    retrieved: 2026-11-02
    quote: >-
      Changing the top-level `effort` value between requests invalidates the prompt cache. To change the level partway through a conversation, use a per-message effort change (beta) instead, which keeps the cache.
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-haiku-5-5
    retrieved: 2026-11-02
    quote: >-
      Changing the top-level `effort` value between requests invalidates the prompt cache for the conversation’s messages. Where your platform supports it, you can change the level partway through a conversation with a per-message effort change (beta), which keeps the cache.
as_of: 2026-11-02
