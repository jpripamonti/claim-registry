id: manual-cot-when-thinking-off
version: 1.0.0
title: With thinking off, asking Claude to reason before answering (final answer in <answer> tags) helps
status: active
technique:
  summary: >
    When thinking is disabled, ask Claude to think through the problem before answering and to put
    the final answer in <answer> tags for extraction.
conditions:
  model_family: [claude]
  model_versions: ">=4.5"   # page scope: current Claude models; written-reasoning-declined-newest-models is the exception for the 5.x models it names
  task_family: [unspecified]
  reasoning: disabled
  tool_use: unspecified
  context_size: unspecified
effect:
  direction: helps
  outcome: reasoning quality without the thinking feature
  magnitude: null
evidence:
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices
    retrieved: 2026-10-25
    quote: >-
      When thinking is off, you can still encourage step-by-step reasoning by asking Claude to think through the problem before it answers, and to put the final answer in <answer> tags so you can extract it.
as_of: 2026-10-25
review_by: 2027-04-25
