id: gemini-3-long-context-instructions-at-end
version: 1.1.0
title: With large context on Gemini 3, put all the context first and the instructions or question at the very end
status: active
technique:
  summary: >
    Supply the documents or code first, bridge with a phrase like "Based on the information
    above...", and place the specific instruction or question last.
conditions:
  model_family: [gemini]
  model_versions: ["3", "3.1", "3.5", "3.6", "3.7", "3.8"]   # "Gemini 3" / "Gemini 3.x" series; pages say nothing about Gemini 4
  task_family: [unspecified]
  reasoning: unspecified
  tool_use: unspecified
  context_size: long
effect:
  direction: helps
  outcome: unspecified ("recommended for optimal results")
  magnitude: null
evidence:
  - tier: asserted
    source: https://ai.google.dev/gemini-api/docs/prompting-strategies
    retrieved: 2026-10-25
    quote: >-
      When providing large amounts of context (e.g., documents, code), supply all the context first. Place your specific instructions or questions at the very end of the prompt.
  - tier: asserted
    source: https://aistudio.google.com/docs/whats-new-gemini-3.5
    retrieved: 2026-11-16
    quote: >-
      When working with large datasets (such as entire books, codebases, or long videos), place your specific instructions or questions at the end of the prompt, after the data context.
as_of: 2026-11-16
review_by: 2027-05-16
relations: {contradicts: [], refines: [], superseded_by: null}
history:
  - 1.1.0 2026-11-16 versions listed as the Gemini 3.x series (now 3 to 3.8, Gemini 4 excluded); evidence added from the Gemini 3.5 Flash page
  - 1.0.0 2026-10-25 created
