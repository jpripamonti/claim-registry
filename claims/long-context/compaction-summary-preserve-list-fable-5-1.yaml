id: compaction-summary-preserve-list-fable-5-1
version: 1.0.0
title: Telling Claude Fable 5.1 exactly what to preserve improves client-side compaction summaries
status: active
technique:
  summary: >
    When compacting a long conversation on the client, give a summarization instruction that lists
    what must be kept: problems and how they were handled, options tried or set aside, decisions and
    constraints stated exactly, current state, open items, and hard-to-reconstruct details. Server-
    side compaction already does this.
