id: gpt-5-6-say-what-edits-preserve
version: 1.0.0
title: For edits, rewrites and summaries on GPT-5.6, tell the model what to preserve
status: active
technique:
  summary: >
    For editing, rewriting, summaries and customer-facing drafts, name what must survive (the
    artifact, length, structure, genre, factual claims) and forbid adding claims, sections or a
    more promotional tone unless asked.
