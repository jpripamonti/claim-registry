id: gemini-3-keep-default-temperature
version: 1.2.0
title: Lowering temperature below the default 1.0 on Gemini 3 can cause looping or degraded performance
status: active
technique:
  summary: >
    Setting temperature below 1.0 on Gemini 3. Leave it at the default and remove low-temperature
    settings carried over from earlier models.
conditions:
  model_family: [gemini]
  model_versions: ["3", "3.1", "3.5", "3.6", "3.7", "3.8"]   # "all Gemini 3 / 3.x models"; pages say nothing about Gemini 4 here
  task_family: [any]           # "For all Gemini 3 models"; harm stated as "particularly" math and reasoning
  reasoning: enabled
  tool_use: unspecified
  context_size: unspecified
effect:
  direction: hurts
  outcome: looping or degraded performance, particularly on complex math or reasoning tasks
  magnitude: null
evidence:
  - tier: asserted
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/start/get-started-with-gemini-3
    retrieved: 2026-11-16
    quote: >-
      Changing the temperature (setting it to less than 1.0) may lead to unexpected behavior, such as looping or degraded performance, particularly in complex mathematical or reasoning tasks.
  - tier: asserted
    source: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/start/get-started-with-gemini-3
    retrieved: 2026-11-16
    quote: >-
      For Gemini 3, it is strongly recommended to keep the temperature parameter at its default value of 1.0.
  - tier: asserted
    source: https://aistudio.google.com/docs/whats-new-gemini-3.5
    retrieved: 2026-11-16
    quote: >-
      temperature, top_p, and top_k are no longer recommended for all Gemini 3.x models. Gemini 3's reasoning capabilities are optimized for the default settings.
  - tier: asserted
    source: https://aistudio.google.com/docs/prompting-strategies
    retrieved: 2026-11-16
    quote: >-
      For earlier Gemini 3 models, keep these parameters at their default values to avoid degraded reasoning performance.
as_of: 2026-11-16
review_by: 2027-05-16
relations: {contradicts: [gemini-sampling-parameters-ignored-3-6-plus], refines: [], superseded_by: null}
history:
  - 1.2.0 2026-11-16 evidence 0 and 1 moved to Google Cloud's "Get started with Gemini 3" guide, which has the same two sentences: the Gemini API's gemini-3 page was retired and now redirects to the Gemini 3.6 page, which does not
  - 1.1.0 2026-11-16 versions listed as the Gemini 3.x series (now 3 to 3.8, Gemini 4 excluded); evidence added from the Gemini 3.5 Flash and prompt design pages; contradicted by gemini-sampling-parameters-ignored-3-6-plus. The gemini-3 page of evidence 0 and 1 now redirects and no longer has those quotes.
  - 1.0.0 2026-10-25 created
