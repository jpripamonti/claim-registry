# Model families and their versions, oldest first. Ranges like ">=4.6" compare positions in these
# lists. A line (claude-opus, ...) belongs to its parent family; a claim on the parent covers every
# line. Versions are strings.

claude:
  versions: ["1.3", "3", "3.5", "3.7", "4", "4.1", "4.5", "4.6", "4.7", "4.8", "5", "5.1", "5.5"]
claude-opus:
  parent: claude
  versions: ["3", "4", "4.1", "4.5", "4.6", "4.7", "4.8", "5", "5.5"]
claude-sonnet:
  parent: claude
  versions: ["3.5", "3.7", "4", "4.5", "4.6", "5", "5.5"]
claude-haiku:
  parent: claude
  versions: ["3", "3.5", "4.5", "5.5"]
claude-fable:
  parent: claude
  versions: ["5", "5.1"]
claude-mythos:
  parent: claude
  versions: ["preview", "5", "5.1"]

gpt:
  versions: ["3.5-turbo", "4", "4o", "4o-mini", "4.1", "5", "5.1", "5.1-mini", "5.2", "5.3", "5.4", "5.5",
             "5.6", "6", "6.1"]
# From GPT-5.6 on, OpenAI names tiers within a version (gpt-5.6-sol, gpt-6.1-terra); not every tier
# has every version, so tiers are lines, as with Claude. "gpt-5.6" is an alias of gpt-5.6-sol.
gpt-astra:
  parent: gpt
  versions: ["6"]
gpt-sol:
  parent: gpt
  versions: ["5.6", "6", "6.1"]
gpt-terra:
  parent: gpt
  versions: ["5.6", "6.1"]
gpt-luna:
  parent: gpt
  versions: ["5.6", "6"]
openai-o:
  versions: ["o1-preview", "o1", "o1-mini", "o3", "o3-mini", "o4-mini"]
gemini:
  versions: ["1.5", "2.0", "2.5", "3", "3.1", "3.5", "3.6", "3.7", "3.8", "4"]
# "Gemini 3" in Google's pages means the 3.x series (3 to 3.8). Gemini 4 models are named
# gemini-4-carbon, gemini-4-argon and gemini-4-hydrogen.
gemini-flash:
  parent: gemini
  versions: ["1.5", "2.0", "2.5", "3", "3.5", "3.6", "3.7", "3.8"]
gemini-flash-lite:
  parent: gemini
  versions: ["2.0", "2.5", "3.1", "3.5"]
gemini-carbon:
  parent: gemini
  versions: ["4"]
gemini-argon:
  parent: gemini
  versions: ["4"]
gemini-hydrogen:
  parent: gemini
  versions: ["4"]

llama:
  versions: ["2", "3", "3.1"]
mistral:
  versions: ["7b-instruct-v0.2", "7b-instruct-v0.3"]
qwen:
  versions: ["2", "2.5", "3"]

other: {}   # models outside this list; versions are free text
