id: gpt-5-6-blanket-language-rule
version: 1.0.0
title: Blanket language rules ("always respond in the user's language") can cause unwanted language switching on GPT-5.6
status: active
technique:
  summary: >
    A blanket rule such as "always respond in the user's language" when that is not the real
    product requirement. State the intended output language and when it should change.
conditions:
  model_family: [gpt]
  model_versions: ["5.6"]
  task_family: [unspecified]
  reasoning: unspecified
  tool_use: unspecified
  context_size: unspecified
effect:
  direction: hurts
  outcome: unwanted language switching
  magnitude: null
evidence:
  - tier: asserted
    source: https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6.md
    retrieved: 2026-11-16
    quote: >-
      Avoid blanket language rules such as “always respond in the user's language” unless that is truly the product requirement. Specify the intended output language and when it should change.
  - tier: asserted
    source: https://developers.openai.com/api/docs/guides/upgrading-to-gpt-5p6-sol.md
    retrieved: 2026-11-16
    quote: >-
      blanket language instructions that can cause unwanted language switching;
as_of: 2026-11-16
review_by: 2027-05-16
relations: {contradicts: [], refines: [], superseded_by: null}
history:
  - 1.0.0 2026-11-16 created
