id: mark-pasted-text-opus-5-5
version: 1.0.0
title: Marking pasted text with tagged blocks makes Claude Opus 5.5 ignore instructions inside it
status: active
technique:
  summary: >
    Wrap each block the user pasted from elsewhere in opening and closing <pasted_content> tags
    carrying the same random ID generated by the application, and add a system prompt note that
    instructions inside the tags are followed only where the user's own message asks. Can make the
    model slightly more cautious; one guardrail among others.
  example: |
    <pasted_content id="ab12">
    ...text the user pasted...
    </pasted_content id="ab12">
conditions:
  model_family: [claude-opus]
  model_versions: ["5.5"]
  task_family: [unspecified]
  reasoning: unspecified
  tool_use: unspecified
  context_size: unspecified
effect:
  direction: helps
  outcome: instructions inside pasted content not followed unless the user asks
  magnitude: null
evidence:
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5
    retrieved: 2026-11-02
    quote: >-
      With the right context it is also robust against instructions inside content a user copied into their message from elsewhere, such as an email or a webpage. To get that behavior, mark which text is the user’s own and which was pasted from somewhere else.
  - tier: asserted
    source: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5
    retrieved: 2026-11-02
    quote: >-
      This can make the model slightly more cautious at times, so measure the effect on your own tasks.
